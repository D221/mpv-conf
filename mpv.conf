# profile=high-quality
# hwdec=auto-safe

keep-open=yes

audio-channels=stereo

directory-mode=ignore

osd-bar=no
border=no

screenshot-directory="~~desktop/"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

audio-file-auto=fuzzy

[no-video]
profile-cond=not (vid)
input-commands="script-binding uosc/toggle-ui"

[4k]
profile-desc = 4K or higher resolution
profile-cond = width>=3840 or height>=2160
profile=fast